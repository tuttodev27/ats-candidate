services:
  postgres:
    image: postgres:16
    container_name: ats-candidate-postgres
    environment:
      POSTGRES_DB: ats_candidate
      POSTGRES_USER: ats-candidate
      POSTGRES_PASSWORD: postgres-candidate
    ports:
      - "5434:5432"
    volumes:
      - ats_candidate_pg_data:/var/lib/postgresql/data

volumes:
  ats_candidate_pg_data:
