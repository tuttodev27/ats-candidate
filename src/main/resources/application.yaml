server:
  port: 8084
spring:
  application:
    name: ats-candidate
  datasource:
    url: jdbc:postgresql://localhost:5434/ats_candidate
    username: ats-candidate
    password: postgres-candidate
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

security:
  jwt:
    secret: ats-users-dev-secret-change-in-prod-2026

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3}
  timeout-seconds: ${OLLAMA_TIMEOUT:60}
  max-text-length: ${OLLAMA_MAX_TEXT:12000}
