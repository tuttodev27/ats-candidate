spring:
  datasource:
    url: jdbc:h2:mem:ats_candidate_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ats-candidate
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.servlet.SecurityAutoConfiguration

  port: 8085